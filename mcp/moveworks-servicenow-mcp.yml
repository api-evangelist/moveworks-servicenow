description: >-
  Moveworks publishes an official hosted MCP server for its developer documentation
  (a Fern-hosted docs MCP server) advertised in docs.moveworks.com/llms.txt for AI
  clients such as Claude Code and Cursor. It exposes a documentation-search tool over
  the streamable-HTTP transport. Verified live on 2026-07-20 via an MCP initialize +
  tools/list handshake. Separately, Moveworks ships an open-source
  Moveworks-MCP-Proxy-Client (TypeScript) on GitHub for connecting to Moveworks MCP
  plugins; the Moveworks AI Assistant platform itself also acts as an MCP host/plugin
  surface. This artifact documents the hosted docs MCP server.
