aid: moveworks-servicenow
name: Moveworks (ServiceNow)
description: >-
  Moveworks is an enterprise AI assistant / agentic automation platform (acquired by
  ServiceNow) that lets employees resolve IT, HR, and other requests in natural language
  across Slack, Microsoft Teams, and 100+ enterprise systems. Its developer platform —
  Agent Studio, Creator Studio, and the AI Agent Marketplace — lets teams build and deploy
  plugins with triggers, slots, and actions, and connect to systems such as ServiceNow,
  Jira, Workday, and Salesforce. Moveworks exposes Bearer-authenticated REST APIs including
  a read-only OData Data API for exporting conversation and interaction data, an Events API,
  a Conversations API, webhook listeners, and customer-hosted gateways, plus an official
  hosted MCP server for its documentation. Surfaced originally as a Bain Capital Ventures
  portfolio company and enriched from Moveworks' public developer documentation.
